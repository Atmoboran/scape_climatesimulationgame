<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klimasimulationsspiel</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="klimaspiel"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <span class="logo" data-brand="logo"></span>
  <div class="top-right">
    <nav class="nav" id="nav" data-t-aria="nav.aria">
      <button type="button" data-part="anleitung"><span class="num">1</span><span data-t="nav.anleitung"></span></button>
      <button type="button" data-part="modell"><span class="num">2</span><span data-t="nav.modell"></span></button>
      <button type="button" data-part="spiel"><span class="num">3</span><span data-t="nav.spiel"></span></button>
      <button type="button" data-part="auswertung"><span class="num">4</span><span data-t="nav.auswertung"></span></button>
    </nav>
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster" id="poster">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 300 300" aria-hidden="true">
    <g fill="currentColor">
      <circle cx="60" cy="60" r="22"/><circle cx="150" cy="60" r="22"/><circle cx="240" cy="60" r="22"/>
      <circle cx="60" cy="150" r="22"/><circle cx="150" cy="150" r="22"/><circle cx="240" cy="150" r="22"/>
      <circle cx="60" cy="240" r="22"/><circle cx="150" cy="240" r="22"/><circle cx="240" cy="240" r="22"/>
    </g>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="200" cy="200" r="170"/>
    <path d="M41,140 H359 M41,260 H359"/>
  </svg>
  <div class="poster-text">
    <p class="kicker" id="poster-kicker"></p>
    <h1 class="headline" data-t-html="poster.headline"></h1>
    <p class="lead" id="poster-lead"></p>
  </div>
</div>

<main class="page">

  <!-- ================= 1 · ANLEITUNG ================= -->
  <section class="part" id="part-anleitung">
    <div class="reading">
      <p class="text" data-t-html="anleitung.intro"></p>
      <div class="section-label" data-t="anleitung.partsTitle"></div>
      <div data-t-html="anleitung.parts"></div>

      <div class="topics">
        <details class="topic" open><summary data-t="anleitung.goal.title"></summary><div class="topic-body" data-t-html="anleitung.goal.body"></div></details>
        <details class="topic">
          <summary data-t="anleitung.setup.title"></summary>
          <div class="topic-body">
            <div data-t-html="anleitung.setup.body"></div>
            <figure class="figure">
              <svg viewBox="0 0 340 240" role="img" data-t-aria="anleitung.setup.figAria">
                <rect x="84" y="10" width="246" height="70" style="fill:var(--band-pole)"/>
                <rect x="84" y="80" width="246" height="70" style="fill:var(--band-tropics)"/>
                <rect x="84" y="150" width="246" height="70" style="fill:var(--band-pole)"/>
                <rect x="84" y="10" width="246" height="210" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="84" y1="80" x2="330" y2="80" stroke="currentColor" stroke-width="2"/>
                <line x1="84" y1="150" x2="330" y2="150" stroke="currentColor" stroke-width="2"/>
                <g class="t">
                  <text x="4" y="42" data-t="anleitung.setup.north"></text><text x="4" y="112" data-t="anleitung.setup.tropics"></text><text x="4" y="182" data-t="anleitung.setup.south"></text>
                </g>
                <g class="t small">
                  <text x="4" y="58" data-t="anleitung.setup.jet"></text><text x="4" y="128" data-t="anleitung.setup.trade"></text><text x="4" y="198" data-t="anleitung.setup.jet"></text>
                </g>
                <g style="fill:var(--paper)" stroke="currentColor" stroke-width="2.5">
                  <circle cx="124" cy="38" r="16"/><circle cx="206" cy="38" r="16"/><circle cx="288" cy="38" r="16"/>
                  <circle cx="124" cy="108" r="16"/><circle cx="206" cy="108" r="16"/><circle cx="288" cy="108" r="16"/>
                  <circle cx="124" cy="178" r="16"/><circle cx="206" cy="178" r="16"/><circle cx="288" cy="178" r="16"/>
                </g>
                <g class="t" text-anchor="middle">
                  <text x="124" y="42">0</text><text x="206" y="42">0</text><text x="288" y="42">0</text>
                  <text x="124" y="112">40</text><text x="206" y="112">34</text><text x="288" y="112">61</text>
                  <text x="124" y="182">0</text><text x="206" y="182">0</text><text x="288" y="182">0</text>
                </g>
                <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M104,68 L308,68 M299,62 L308,68 L299,74" style="stroke:var(--zone-north)"/>
                  <path d="M308,138 L104,138 M113,132 L104,138 L113,144" style="stroke:var(--zone-tropics)"/>
                  <path d="M104,208 L308,208 M299,202 L308,208 L299,214" style="stroke:var(--zone-north)"/>
                </g>
              </svg>
              <figcaption data-t-html="anleitung.setup.caption"></figcaption>
            </figure>
          </div>
        </details>
        <details class="topic">
          <summary data-t="anleitung.round.title"></summary>
          <div class="topic-body">
            <div data-t-html="anleitung.round.body"></div>
            <figure class="figure">
              <svg viewBox="0 0 340 210" role="img" data-t-aria="anleitung.round.figAria">
                <g stroke="currentColor" stroke-width="2">
                  <rect x="130" y="12" width="80" height="50" style="fill:var(--band-pole)"/>
                  <rect x="130" y="80" width="80" height="50" style="fill:var(--band-tropics)"/>
                  <rect x="130" y="148" width="80" height="50" style="fill:var(--band-pole)"/>
                </g>
                <g class="t" text-anchor="middle">
                  <text x="170" y="41" data-t="anleitung.setup.north"></text><text x="170" y="109" data-t="anleitung.setup.tropics"></text><text x="170" y="177" data-t="anleitung.setup.south"></text>
                </g>
                <g fill="none" style="stroke:var(--zone-tropics)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M152,80 L152,66 M146,72 L152,65 L158,72"/>
                  <path d="M188,130 L188,144 M182,138 L188,145 L194,138"/>
                </g>
                <text class="t small" x="216" y="72" data-t="anleitung.round.half"></text>
                <text class="t small" x="216" y="150" data-t="anleitung.round.orHere"></text>
                <circle cx="300" cy="105" r="14" style="fill:var(--sun);stroke:var(--ink)" stroke-width="2"/>
                <path d="M284,105 L216,105 M225,99 L216,105 L225,111" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <text class="t" x="252" y="97" text-anchor="middle">+8</text>
                <g fill="none" style="stroke:var(--zone-north)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M128,37 C115,31 108,43 95,37 C84,32 78,40 66,37 M75,31 L66,37 L75,43"/>
                  <path d="M128,173 C115,167 108,179 95,173 C84,168 78,176 66,173 M75,167 L66,173 L75,179"/>
                </g>
                <g class="t">
                  <text x="20" y="42">−4</text><text x="20" y="178">−4</text>
                </g>
                <text class="t small" x="4" y="110" data-t="anleitung.round.space"></text>
              </svg>
              <figcaption data-t-html="anleitung.round.caption"></figcaption>
            </figure>
          </div>
        </details>
        <details class="topic"><summary data-t="anleitung.twist.title"></summary><div class="topic-body" data-t-html="anleitung.twist.body"></div></details>
        <details class="topic"><summary data-t="anleitung.observe.title"></summary><div class="topic-body" data-t-html="anleitung.observe.body"></div></details>
        <details class="topic"><summary data-t="anleitung.tips.title"></summary><div class="topic-body" data-t-html="anleitung.tips.body"></div></details>
        <details class="topic"><summary data-t="anleitung.discuss.title"></summary><div class="topic-body" data-t-html="anleitung.discuss.body"></div></details>
      </div>
    </div>
    <div class="next-part"><button type="button" class="btn" data-goto="modell"></button></div>
  </section>

  <!-- ================= 2 · MODELL ================= -->
  <section class="part" id="part-modell" hidden>
    <div class="lab">
      <div class="lab-stage">
        <div class="stage-frame square fit" id="model-frame">
          <canvas id="model-field" class="field" role="img" data-t-aria="modell.fieldAria"></canvas>
        </div>
        <p class="phase-caption" id="model-caption" aria-live="polite"></p>
      </div>

      <div class="lab-post">
        <div class="readout-grid" aria-live="polite">
          <div><span data-t="modell.readout.round"></span><b id="mo-round">0</b></div>
          <div><span data-t="modell.readout.mean"></span><b id="mo-mean">–</b></div>
          <div><span data-t="modell.readout.sum"></span><b id="mo-sum">–</b></div>
          <div><span data-t="modell.readout.loss"></span><b id="mo-warm">–</b></div>
        </div>
        <div class="btn-row">
          <button class="btn big primary" id="mo-play" type="button">
            <svg id="mo-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>
            <span><span id="mo-play-label" data-t="modell.play.start"></span><span class="sub" id="mo-play-sub" data-t="modell.play.subPlay"></span></span>
          </button>
          <button class="btn big" id="mo-step" type="button">
            <span><span data-t="modell.step"></span><span class="sub" data-t="modell.stepSub"></span></span>
          </button>
          <button class="btn big" id="mo-end" type="button">
            <span><span data-t="modell.end"></span><span class="sub" data-t="modell.endSub"></span></span>
          </button>
        </div>
        <div class="range">
          <label for="mo-speed" data-t="modell.speed"></label>
          <input type="range" id="mo-speed" min="0.5" max="4" step="0.5" value="1">
          <output id="mo-speed-label" for="mo-speed"></output>
        </div>
        <p class="hint" data-t="modell.hint"></p>
        <div class="merke">
          <h3 data-t="modell.merkeTitle"></h3>
          <p data-t="modell.merke"></p>
        </div>

        <div class="chart-card">
          <div class="chart-head">
            <span class="chart-title"><span data-t="modell.meanTitle"></span><small data-t="modell.meanSub"></small></span>
          </div>
          <canvas id="model-mean" class="chart" role="img" data-t-aria="modell.meanAria"></canvas>
        </div>
        <div class="btn-row">
          <button class="btn" id="mo-new" type="button"><span><span data-t="modell.newRun"></span><span class="sub" data-t="modell.newRunSub"></span></span></button>
          <button class="btn" id="mo-results" type="button" data-t="modell.allCharts"></button>
        </div>

        <details class="topic settings" id="model-settings">
          <summary data-t="modell.settings.title"></summary>
          <div class="topic-body">
            <div class="section-label with-tools">
              <span data-t="modell.settings.stable"></span>
              <button type="button" class="info" aria-controls="h-stable" data-t-aria="modell.settings.stableAria"></button>
            </div>
            <div class="info-note" id="h-stable" hidden data-t-html="modell.settings.stableNote"></div>
            <div class="params" id="model-params"></div>
            <div class="params seed-row">
              <div class="param">
                <div class="param-head">
                  <label for="mo-seed"><span data-t="modell.settings.seed"></span><small data-t="modell.settings.seedSub"></small></label>
                  <button type="button" class="info" aria-controls="h-seed" data-t-aria="modell.settings.seedAria"></button>
                </div>
                <input type="number" id="mo-seed">
                <div class="info-note" id="h-seed" hidden data-t-html="modell.settings.seedNote"></div>
              </div>
              <button class="btn" type="button" id="mo-reseed" data-t="modell.settings.reseed"></button>
            </div>
            <div class="btn-row">
              <button class="btn" type="button" id="mo-defaults" data-t="modell.settings.defaults"></button>
              <button class="btn" type="button" id="mo-apply" data-t="modell.settings.apply"></button>
            </div>
            <p class="note" data-t="modell.settings.note"></p>
          </div>
        </details>
      </div>
    </div>
    <div class="next-part"><button type="button" class="btn" data-goto="spiel"></button></div>
  </section>

  <!-- ================= 3 · SPIEL LEITEN ================= -->
  <section class="part" id="part-spiel" hidden>
    <div id="live-root"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <div class="next-part"><button type="button" class="btn" data-goto="auswertung"></button></div>
  </section>

  <!-- ================= 4 · AUSWERTUNG ================= -->
  <section class="part" id="part-auswertung" hidden>
    <div class="res-tools no-beamer">
      <div class="seg" id="res-source" role="group" data-t-aria="results.sourceAria">
        <button class="btn" type="button" data-source="game" data-t="results.game"></button>
        <button class="btn" type="button" data-source="model" data-t="results.model"></button>
      </div>
    </div>
    <div class="empty" id="res-empty" hidden></div>
    <div id="res-body">
      <div class="section-label with-tools">
        <span id="res-label"></span>
        <button class="btn slim" type="button" id="res-beamer" data-t="results.beamer"></button>
      </div>
      <div class="readout-grid">
        <div><span data-t="results.readout.n"></span><b id="ro-n">–</b></div>
        <div><span data-t="results.readout.m0"></span><b id="ro-m0">–</b></div>
        <div><span data-t="results.readout.m1"></span><b id="ro-m1">–</b></div>
        <div><span data-t="results.readout.grad"></span><b id="ro-grad">–</b></div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-head">
            <span class="chart-title"><span data-t="results.heatTitle"></span><small data-t="results.heatSub"></small></span>
            <button class="btn slim no-beamer" type="button" data-png="res-heat" data-t="results.png"></button>
          </div>
          <canvas id="res-heat" class="chart heat" role="img" data-t-aria="results.heatAria"></canvas>
          <div class="heat-row">
            <button class="btn slim" type="button" id="heat-play" data-t="results.play"></button>
            <input type="range" id="heat-k" min="0" max="1" step="1" value="0" data-t-aria="results.roundSlider">
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-head">
            <span class="chart-title"><span data-t="results.meanTitle"></span><small data-t="results.meanSub"></small></span>
            <button class="btn slim no-beamer" type="button" data-png="res-mean" data-t="results.png"></button>
          </div>
          <div class="legend" id="leg-mean"></div>
          <canvas id="res-mean" class="chart" role="img" data-t-aria="results.meanAria"></canvas>
          <p class="chart-note" id="note-mean"></p>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-head">
            <span class="chart-title"><span data-t="results.zonalTitle"></span><small data-t="results.zonalSub"></small></span>
            <button class="btn slim no-beamer" type="button" data-png="res-zonal" data-t="results.png"></button>
          </div>
          <div class="legend" id="leg-zonal"></div>
          <canvas id="res-zonal" class="chart wide" role="img" data-t-aria="results.zonalAria"></canvas>
          <label class="toggle"><input type="checkbox" id="res-ens"> <span data-t="results.ens"></span></label>
        </div>

        <div class="chart-card">
          <div class="chart-head">
            <span class="chart-title"><span data-t="results.smTitle"></span><small id="sm-sub"></small></span>
          </div>
          <div class="seg sm-mode" id="sm-mode">
            <button class="btn active" type="button" data-sm="pos" data-t="results.smPos"></button>
            <button class="btn" type="button" data-sm="person" data-t="results.smPerson"></button>
          </div>
          <div class="sm-grid" id="res-sm"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/model-view.js"></script>
<script src="js/live.js"></script>
<script src="js/results.js"></script>
<script src="js/app.js"></script>
</body>
</html>
